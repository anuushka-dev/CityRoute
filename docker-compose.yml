services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cityroute-api:tier2-phase7
    container_name: cityroute-api-tier2-phase-7
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      CITYROUTE_REDIS_URL: redis://redis:6379/0
      CITYROUTE_ENVIRONMENT: docker
      WEB_CONCURRENCY: "2"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: cityroute-redis-tier2-phase-7
    # Redis is only reachable on the internal compose network, NOT published to the
    # host. Publishing 6379 exposed an unauthenticated cache to the host/LAN.
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: cityroute-api:tier4-phase11
    container_name: cityroute-api-tier4-phase11

    ports:
      - "8001:8000"

    env_file:
      - .env

    environment:
      CITYROUTE_ENVIRONMENT: docker
      CITYROUTE_LOG_LEVEL: INFO
      CITYROUTE_REDIS_URL: redis://redis:6379/0

      # Phase 11 benchmark baseline.
      # Multi-worker behavior is tested separately.
      WEB_CONCURRENCY: "1"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./data:/app/data

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5); sys.exit(0 if r.status == 200 else 1)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: cityroute-redis-tier4-phase11

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000"
      ]

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    restart: unless-stopped

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: cityroute-prometheus-tier4-phase11

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    depends_on:
      api:
        condition: service_started

    networks:
      - backend

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9090/-/healthy"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
  prometheus_data:

networks:
  backend:
    driver: bridge
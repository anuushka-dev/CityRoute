services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cityroute-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      CITYROUTE_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cityroute-redis
    ports:
      - "6379:6379"
    restart: unless-stopped